title: Odoo Essentials
name: Odoo Essentials
description: >-
  Beyond code, towards solutions solving real needs.
url: "https://odooessentials.github.io"
baseurl: ""
repository: OdooEssentials/OdooEssentials.github.io
logo: /assets/images/logo.png
locale: en-US

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: sunrise

author:
  name: Daniel Reis
  avatar: /assets/images/favicon.png
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/dreispt

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/OdooEssentials

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

collections:
  projects:
    output: true
    permalink: /projects/:name/
  docs:
    output: true
    permalink: /docs/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
  - scope:
      path: ""
      type: docs
    values:
      layout: single

comments:
  provider: giscus
  giscus:
    repo_id: ""
    category_name: General
    category_id: ""

analytics:
  provider: custom
cloudflare_analytics_token: ""
